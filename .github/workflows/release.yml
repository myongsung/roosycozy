name: "Build Windows EXE"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: npm install --legacy-peer-deps

      # ✅ 1. Tauri 빌드 및 GitHub Release 초안(Draft) 생성
      - name: build the app (portable exe + draft release)
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v1.0.${{ github.run_number }}
          releaseName: "App Build v1.0.${{ github.run_number }}"
          
          # 🚨 핵심 추가: 앱 내부 버전을 깃허브 릴리즈 버전과 똑같이 강제로 맞춥니다!
          appVersion: "1.0.${{ github.run_number }}"
          
          releaseBody: "Automated Windows build."
          # 🚨 주의: draft가 true면 관리자가 수동으로 'Publish'를 눌러야 유저에게 업데이트가 배포됩니다.
          releaseDraft: true 
          prerelease: false
          args: --no-bundle
          uploadPlainBinary: true

      # ✅ 2. self_update 라이브러리를 위한 포터블 exe 압축 (.zip 생성)
      - name: Compress portable exe for auto-updater
        run: |
          cd src-tauri/target/release
          Compress-Archive -Path roosycozy.exe -DestinationPath roosycozy-x86_64-pc-windows-msvc.zip

      # ✅ 3. 생성된 .zip 파일을 방금 생성된 GitHub Release에 추가 업로드
      - name: Upload ZIP to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 태그 이름을 v1.0... 으로 동일하게 맞췄습니다.
          gh release upload v1.0.${{ github.run_number }} src-tauri/target/release/roosycozy-x86_64-pc-windows-msvc.zip

      # ✅ 4. (기존) 포터블 exe Workflow Artifacts 업로드 (테스트용)
      - name: upload portable exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: roosycozy-portable-exe
          path: src-tauri/target/release/*.exe
          if-no-files-found: error

      # ✅ 5. (기존) 설치형 번들 수집 (만약을 대비함)
      - name: upload installer artifacts (if any)
        uses: actions/upload-artifact@v4
        with:
          name: roosycozy-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn