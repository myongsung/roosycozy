name: "Build Windows EXE"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # 🚨 수정됨: lts/* 대신 명확하게 Node.js 20버전(가장 안정적인 최신 LTS)을 고정하여 에러를 방지합니다.
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: npm install --legacy-peer-deps

      # ✅ 1. Tauri 빌드 및 GitHub Release 초안(Draft) 생성
      - name: build the app (portable exe + draft release)
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v1.0.${{ github.run_number }}
          releaseName: "App Build v1.0.${{ github.run_number }}"
          
          # 앱 내부 버전을 깃허브 릴리즈 버전과 똑같이 강제로 맞춰 무한 업데이트를 방지합니다.
          appVersion: "1.0.${{ github.run_number }}"
          
          releaseBody: "Automated Windows build."
          releaseDraft: true # 빌드 후 깃허브에서 'Publish release'를 수동으로 눌러야 배포됩니다.
          prerelease: false
          args: --no-bundle
          uploadPlainBinary: true

      # ✅ 2. self_update 라이브러리를 위한 포터블 exe 압축 (.zip 생성)
      - name: Compress portable exe for auto-updater
        run: |
          cd src-tauri/target/release
          Compress-Archive -Path roosycozy.exe -DestinationPath roosycozy-x86_64-pc-windows-msvc.zip

      # ✅ 3. 생성된 .zip 파일을 방금 생성된 GitHub Release에 추가 업로드
      - name: Upload ZIP to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.${{ github.run_number }} src-tauri/target/release/roosycozy-x86_64-pc-windows-msvc.zip

      # ✅ 4. 포터블 exe Workflow Artifacts 업로드 (테스트 및 보관용)
      - name: upload portable exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: roosycozy-portable-exe
          path: src-tauri/target/release/*.exe
          if-no-files-found: error

      # ✅ 5. 설치형 번들 수집 (추후 MSI/NSIS 빌드 시 대비용)
      - name: upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: roosycozy-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          # 🚨 수정됨: 포터블 exe만 빌드하므로 설치형 파일이 없어도 액션 로그에 노란색 경고가 뜨지 않게 합니다.
          if-no-files-found: ignore